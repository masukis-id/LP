<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Diagram skematik zona hotel di sekitar Masjidil Haram</title>
<desc id="d">Tiga zona jarak dari gerbang Masjidil Haram: 0 m, 100 sampai 300 m, dan 300 sampai 500 m. Kompleks Abraj Al Bait di sisi selatan dekat Gerbang King Abdulaziz, hotel InterContinental Dar Al Tawhid di sisi barat dekat Gerbang King Fahd, dan hotel Jabal Omar di barat daya. Tidak sesuai skala.</desc>
<rect width="640" height="720" rx="20" fill="#fffdf7"/>
<text x="320" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f5132">Zona Hotel di Sekitar Masjidil Haram</text>
<text x="320" y="60" text-anchor="middle" font-size="13" fill="#5c6b63">Diagram skematik, tidak sesuai skala</text>
<text x="320" y="78" text-anchor="middle" font-size="13" fill="#5c6b63">Jarak diukur dari gerbang Haram terdekat, bukan dari Ka'bah</text>
<ellipse cx="320" cy="340" rx="300" ry="235" fill="#f3ece0" stroke="#b89a6a" stroke-width="2" stroke-dasharray="6 5"/>
<ellipse cx="320" cy="340" rx="215" ry="170" fill="#e3f0e8" stroke="#0f5132" stroke-width="2"/>
<ellipse cx="320" cy="340" rx="135" ry="105" fill="#fff4dc" stroke="#b8923a" stroke-width="2.5"/>
<text x="320" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5630">300–500 m</text>
<text x="320" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#0f5132">100–300 m</text>
<text x="320" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6a1f">0 m (pelataran)</text>
<rect x="235" y="280" width="170" height="120" rx="14" fill="#e9c46a" fill-opacity=".55" stroke="#b8923a" stroke-width="2"/>
<circle cx="320" cy="340" r="38" fill="#fff" stroke="#b8923a"/>
<rect x="313" y="326" width="14" height="14" fill="#111"/>
<text x="320" y="360" text-anchor="middle" font-size="11" fill="#333">Ka'bah</text>
<text x="320" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#5b4a1a">Masjidil Haram</text>
<line x1="418" y1="288" x2="418" y2="392" stroke="#b8923a" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
<text transform="translate(434 340) rotate(90)" text-anchor="middle" font-size="11" fill="#5b4a1a" stroke="#fffdf7" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Mas'a (Safa–Marwah)</text>
<circle cx="320" cy="400" r="6" fill="#b8923a" stroke="#fff" stroke-width="2"/>
<text x="320" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2a24" stroke="#fffdf7" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Gerbang King Abdulaziz</text>
<circle cx="235" cy="340" r="6" fill="#b8923a" stroke="#fff" stroke-width="2"/>
<text x="226" y="326" text-anchor="end" font-size="12" font-weight="700" fill="#1d2a24" stroke="#fffdf7" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Gerbang</text>
<text x="226" y="341" text-anchor="end" font-size="12" font-weight="700" fill="#1d2a24" stroke="#fffdf7" stroke-width="4" paint-order="stroke" stroke-linejoin="round">King Fahd</text>
<rect x="60" y="232" width="150" height="58" rx="10" fill="#fff" stroke="#b8923a" stroke-width="1.5"/>
<text x="135" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2a24">InterContinental</text>
<text x="135" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2a24">Dar Al Tawhid</text>
<text x="135" y="283" text-anchor="middle" font-size="11" fill="#5c6b63">≈0 m · sisi barat</text>
<line x1="320" y1="430" x2="320" y2="440" stroke="#888" stroke-width="1.2"/>
<rect x="170" y="440" width="300" height="92" rx="10" fill="#fff" stroke="#b8923a" stroke-width="1.5"/>
<text x="320" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2a24">Kompleks Abraj Al Bait · sisi selatan</text>
<text x="320" y="480" text-anchor="middle" font-size="13" fill="#1d2a24">Fairmont · Swissôtel · Raffles</text>
<text x="320" y="498" text-anchor="middle" font-size="13" fill="#1d2a24">Mövenpick · Pullman ZamZam</text>
<text x="320" y="516" text-anchor="middle" font-size="13" fill="#1d2a24">Sofwah Royal Orchid / Al Ghufran</text>
<text x="320" y="529" text-anchor="middle" font-size="10" fill="#5c6b63">≈0–20 m</text>
<rect x="20" y="372" width="140" height="70" rx="10" fill="#fff" stroke="#b89a6a" stroke-width="1.5"/>
<text x="90" y="391" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2a24">Jabal Omar</text>
<text x="90" y="407" text-anchor="middle" font-size="12" fill="#1d2a24">Hilton Suites · Conrad</text>
<text x="90" y="422" text-anchor="middle" font-size="12" fill="#1d2a24">Marriott · barat daya</text>
<text x="90" y="436" text-anchor="middle" font-size="11" fill="#5c6b63">≈260–450 m*</text>
<g transform="translate(596 112)"><path d="M0 14 L0 -14 M-7 -6 L0 -14 L7 -6" stroke="#0f5132" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5132">U</text></g>
<rect x="24" y="592" width="14" height="14" rx="3" fill="#fff4dc" stroke="#b8923a"/><text x="46" y="604" font-size="13" fill="#1d2a24"><tspan font-weight="700">0 m</tspan>: keluar hotel langsung ke pelataran, tanpa shuttle</text>
<rect x="24" y="614" width="14" height="14" rx="3" fill="#e3f0e8" stroke="#0f5132"/><text x="46" y="626" font-size="13" fill="#1d2a24"><tspan font-weight="700">100–300 m</tspan>: jalan kaki sekitar 3–5 menit</text>
<rect x="24" y="636" width="14" height="14" rx="3" fill="#f3ece0" stroke="#b89a6a"/><text x="46" y="648" font-size="13" fill="#1d2a24"><tspan font-weight="700">300–500 m</tspan>: sekitar 5–8 menit jalan kaki atau shuttle</text>
<text x="24" y="672" font-size="11.5" fill="#5c6b63">Tidak digambar (sisi belum terverifikasi): Anjum Hotel, Hilton Convention.</text>
<text x="24" y="688" font-size="11.5" fill="#5c6b63">*Jarak Jabal Omar bervariasi menurut titik ukur gerbang.</text>
<text x="24" y="704" font-size="11.5" fill="#5c6b63">Estimasi dari e-book @masukis dan listing OTA. Cek ulang di Nusuk/peta resmi.</text>
</svg>